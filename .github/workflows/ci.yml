name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SpoolManager.sln

      - name: Build
        run: dotnet build SpoolManager.sln -c Release --no-restore

      - name: Test
        run: |
          if ls tests/*/*.csproj >/dev/null 2>&1; then
            dotnet test SpoolManager.sln -c Release --no-build --logger "console;verbosity=normal"
          else
            echo "No test projects found"
          fi

      - name: Validate i18n files
        run: |
          python3 - <<'PY'
          import json, sys
          de = json.load(open("src/SpoolManager.Client/wwwroot/i18n/de.json", encoding="utf-8"))
          en = json.load(open("src/SpoolManager.Client/wwwroot/i18n/en.json", encoding="utf-8"))
          missing_de = sorted(set(en) - set(de))
          missing_en = sorted(set(de) - set(en))
          if missing_de: print("Missing in de.json:", missing_de)
          if missing_en: print("Missing in en.json:", missing_en)
          sys.exit(1 if missing_de or missing_en else 0)
          PY

  migrations:
    # Production runs MySQL 8 – start the app against it so every migration is executed.
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: SpoolManager
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -pci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish
        run: dotnet publish src/SpoolManager.Server/SpoolManager.Server.csproj -c Release -o ./publish

      - name: Start app and run migrations
        working-directory: ./publish
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://127.0.0.1:5000
          Kestrel__Endpoints__Http__Url: http://127.0.0.1:5000
          ConnectionStrings__Default: Server=127.0.0.1;Port=3306;Database=SpoolManager;User=root;Password=ci;
          Jwt__SecretKey: ci-secret-ci-secret-ci-secret-ci-secret
        run: |
          dotnet SpoolManager.Server.dll > app.log 2>&1 &
          PID=$!
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5000/api/public/branding > /dev/null; then
              echo "App started, migrations applied"
              kill $PID
              exit 0
            fi
            if ! kill -0 $PID 2>/dev/null; then break; fi
            sleep 2
          done
          cat app.log
          exit 1

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t spoolhero:ci .
