<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>SpoolHero – Filament Management for 3D Printers</title>
    <meta name="description" content="SpoolHero is the free solution for managing 3D printing filament spools. RFID tracking, material database, team projects, dryer monitoring and more." />
    <meta name="keywords" content="SpoolHero, Filament, 3D printing, spool, RFID, OpenSpool, filament management, 3D Printer, Filament Manager" />
    <meta name="author" content="Phillip Weitkamp" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="__ORIGIN__/" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="__ORIGIN__/" />
    <meta property="og:title" content="SpoolHero – Filament Management for 3D Printers" />
    <meta property="og:description" content="Free filament management with RFID tracking, material database, team projects and dryer monitoring." />
    <meta property="og:image" content="__ORIGIN__/api/public/og-image" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="de_DE" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SpoolHero – Filament Management for 3D Printers" />
    <meta name="twitter:description" content="Free filament management with RFID tracking, material database, team projects and dryer monitoring." />
    <meta name="twitter:image" content="__ORIGIN__/api/public/og-image" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "SpoolHero",
      "description": "Self-hosted filament management for 3D printers. RFID tracking (OpenSpool), material database, team projects, dryer monitoring.",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "EUR"
      },
      "author": {
        "@type": "Person",
        "name": "Phillip Weitkamp",
        "email": "info@spoolhero.com"
      }
    }
    </script>

    <base href="/" />
    <meta name="theme-color" content="#F4F5F7" />
    <script>
        (function () {
            try {
                var p = localStorage.getItem('theme') || 'auto';
                var t = p === 'auto' ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : p;
                document.documentElement.setAttribute('data-bs-theme', t);
            } catch (e) { }
        })();
    </script>
    <style>
        /* Boot screen: shown before app.css and Blazor are loaded, so it carries its own theme colours */
        html { background: #F4F5F7; color: #12151C; }
        html[data-bs-theme="dark"] { background: #0C0E13; color: #E8EBF2; }
        .sh-boot { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        .sh-boot-ring { width: 76px; height: 76px; }
        .sh-boot-ring .t { stroke: #E2E5EA; }
        .sh-boot-ring .a { stroke: #3155F5; transform-origin: 28px 28px; animation: sh-boot-spin 1.1s cubic-bezier(.55, .15, .45, .85) infinite; }
        .sh-boot-ring .h { fill: #F4F5F7; stroke: #CDD2DA; }
        html[data-bs-theme="dark"] .sh-boot-ring .t { stroke: #262B38; }
        html[data-bs-theme="dark"] .sh-boot-ring .a { stroke: #7D95FF; }
        html[data-bs-theme="dark"] .sh-boot-ring .h { fill: #0C0E13; stroke: #3A4256; }
        .sh-boot-name { font-family: "Space Grotesk", "Inter", system-ui, sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.02em; }
        .sh-boot-text { font-size: 14px; color: #596172; margin: 0; }
        html[data-bs-theme="dark"] .sh-boot-text { color: #A3ABBB; }
        @keyframes sh-boot-spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .sh-boot-ring .a { animation-duration: 3s; } }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" href="/api/public/favicon" />
    <link href="SpoolManager.Client.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div class="sh-boot" role="status" aria-live="polite">
            <svg class="sh-boot-ring" viewBox="0 0 56 56" aria-hidden="true" focusable="false">
                <circle class="t" cx="28" cy="28" r="22" fill="none" stroke-width="8" />
                <circle class="a" cx="28" cy="28" r="22" fill="none" stroke-width="8" stroke-linecap="round" stroke-dasharray="48 139" />
                <circle class="h" cx="28" cy="28" r="17.6" stroke-width="1" />
            </svg>
            <div class="sh-boot-name">SpoolHero</div>
            <p class="sh-boot-text" id="sh-boot-text">Loading …</p>
        </div>
        <script>
            (function () {
                try {
                    var l = localStorage.getItem('lang_manual') || (navigator.language || 'en');
                    if (l.toLowerCase().indexOf('de') === 0) document.getElementById('sh-boot-text').textContent = 'Wird geladen …';
                } catch (e) { }
            })();
        </script>
    </div>

    <div id="blazor-error-ui" class="alert alert-danger fixed-bottom m-3 d-none" role="alert">
        Ein unerwarteter Fehler ist aufgetreten.
        <a href="" class="alert-link">Neu laden</a>
        <button type="button" class="btn-close float-end" data-bs-dismiss="alert" aria-label="Schließen"></button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function spoolHeroSetFavicon(dataUrl) {
            var link = document.querySelector("link[rel='icon']");
            if (!link) { link = document.createElement('link'); link.rel = 'icon'; document.head.appendChild(link); }
            link.href = dataUrl;
        }
    </script>
    <script src="js/nfc.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/clipboard.js"></script>
    <script src="js/download.js"></script>
    <script src="js/material-picker.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
